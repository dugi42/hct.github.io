name: Update Bike Attendance

on:
  schedule:
    # Target is 20:00 Europe/Vienna every day, but cron here is UTC only and
    # Vienna shifts with DST: 18:00 UTC during CEST, 19:00 UTC during CET.
    # Both fire year-round; the gate job below keeps whichever one matches the
    # current offset, so exactly one run per day survives.
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Pick the cron that means 20:00 in Vienna
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # GitHub queues scheduled runs and routinely starts them one to three
          # hours late, so the wall clock at start time says nothing about which
          # cron fired -- reading it here skipped every run from 2026-08-26 on.
          # Decide from the cron expression instead: Vienna is UTC+2 in CEST and
          # UTC+1 in CET, so exactly one entry is 20:00 local on any given day.
          offset=$(TZ=Europe/Vienna date +%z)
          case "$offset" in
            +0200) want="0 18 * * *" ;;
            +0100) want="0 19 * * *" ;;
            *) echo "Unexpected Europe/Vienna UTC offset: $offset" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" != "schedule" ] || [ "$SCHEDULE" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (event: $EVENT_NAME, cron: ${SCHEDULE:-n/a}, Vienna offset: $offset)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: cron '$SCHEDULE' is not 20:00 Vienna at offset $offset."
          fi

  update-bike-attendance:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Fetch bike attendance
        env:
          VEREINSPLANER_API_TOKEN: ${{ secrets.VEREINSPLANER_API_TOKEN }}
        run: uv run python/fetch_bike_attendance.py

      - name: Commit updates
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/202526_season/raw/202526_bike_attendance.json \
                  public/202526_season/gold/202526_top_bikers.csv
          git commit -m "chore: update bike attendance data ($(TZ=Europe/Vienna date +%Y-%m-%d))"
          git push

  publish:
    needs: update-bike-attendance
    if: needs.update-bike-attendance.outputs.changed == 'true'
    # A GITHUB_TOKEN push does not fire the FTP workflow's `push` trigger, so
    # without this the fresh data would sit unpublished until 03:00 UTC.
    uses: ./.github/workflows/ftp-upload.yml
    secrets: inherit
