name: Update Training Attendance

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip sync --system pyproject.toml

      - name: Fetch attendance report
        env:
          VEREINSPLANER_API_TOKEN: ${{ secrets.VEREINSPLANER_API_TOKEN }}
          VEREINSPLANER_API_URL: ${{ secrets.VEREINSPLANER_API_URL }}
        run: python python/fetch_attendance.py

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/attendance_report.csv
          git commit -m "Update attendance_report.csv"
          git push
