name: Update Training Attendance

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Automatically caches the environment for faster daily runs
          enable-cache: true

      - name: Install dependencies
        # This reads pyproject.toml and installs the required Python version automatically
        run: uv sync

      - name: Fetch attendance report
        env:
          VEREINSPLANER_API_TOKEN: ${{ secrets.VEREINSPLANER_API_TOKEN }}
          VEREINSPLANER_API_URL: ${{ secrets.VEREINSPLANER_API_URL }}
        # Use 'uv run' to ensure the script uses the environment created in the step above
        run: uv run python/fetch_attendance.py

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/attendance_report.csv
          git commit -m "Update attendance_report.csv"
          git push
