name: Publish HC Stats via FTP

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via LFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          # Settings to handle unstable connections:
          # net:timeout 30 - wait 30s before giving up
          # net:max-retries 10 - try again if the server drops the connection
          lftp -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 10;
            open -p ${FTP_PORT} -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST};
            cd ${FTP_REMOTE_DIR};
            mirror -R \
              --only-newer \
              --ignore-time \
              --delete \
              --verbose \
              --exclude .git/ \
              --exclude .github/ \
              --exclude .venv/ \
              --exclude .gitignore \
              --exclude pyproject.toml \
              --exclude .python-version \
              --exclude package.json \
              --exclude README.md \
              --exclude .DS_Store \
              --exclude uv.lock \
              ./ .;
            bye
          "