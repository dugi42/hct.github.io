name: Publish HC Stats via FTP

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          dangerous-clean-slate: false
          # --- Stability Settings ---
          timeout: 90000       # 90 second timeout for large media files
          # --------------------------
          exclude: |
            **/.git*
            **/.git*/**
            **/.venv/**
            .venv/
            .gitignore
            pyproject.toml
            .python-version
            package.json
            README.md
            **/.DS_Store
            uv.lock