name: Publish HC Stats via FTP

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via LFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          test -n "${FTP_HOST}"
          test -n "${FTP_USER}"
          test -n "${FTP_PASSWORD}"
          test -n "${FTP_REMOTE_DIR}"
          test -f public/hcstats.json

          # Upload only the required JSON file via FTPS and overwrite target.
          # This avoids mirror heuristics that can skip updates when size/timestamps match.
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:timeout 30;
            set net:max-retries 10;
            set xfer:clobber on;
            open -p ${FTP_PORT} -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST};
            mkdir -p ${FTP_REMOTE_DIR}/public;
            put -O ${FTP_REMOTE_DIR}/public/ public/hcstats.json;
            bye
          "
