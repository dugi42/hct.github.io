name: Publish HC Stats via FTP

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"
    # Safety net ~45 min after each candidate bike-attendance hour (18:00 UTC
    # in CEST, 19:00 in CET). If that job's own publish leg failed — as it did
    # on 2026-08-09 — the data reaches the server within the hour instead of
    # waiting for 03:00. A no-op mirror is one connection and ~90 seconds.
    - cron: "45 18 * * *"
    - cron: "45 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload every tracked file, ignoring the hash manifest"
        required: false
        default: false
        type: boolean
  # Callable by the jobs that commit new data, because a push made with
  # GITHUB_TOKEN does not trigger the `push` event above.
  workflow_call:
    inputs:
      force:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# The FTP account tolerates one session at a time; queue overlapping runs
# instead of letting a push-triggered mirror collide with the scheduled one.
concurrency:
  group: ftp-publish
  cancel-in-progress: false

jobs:
  ftp-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Mirror the branch tip, not github.sha. When a caller commits data
          # and then invokes this workflow, github.sha still points at the
          # commit that *started* the run — one commit behind the data — so the
          # mirror would publish the previous tree and report success.
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Mirror tracked files to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_FORCE: ${{ inputs.force || 'false' }}
          # A host that is down stays down for the whole retry window (see the
          # 2026-08-11 outage: 10 attempts over 33 minutes, all timed out).
          # The scheduled safety-net mirrors re-run within the hour anyway, so
          # cap the in-run budget at ~8 minutes instead of burning the runner.
          FTP_MAX_RETRIES: 5
          FTP_RETRY_MAX_DELAY_SECONDS: 60
          # The server presents a valid Sectigo-signed *.kasserver.com
          # certificate, so there is no reason to accept unverified TLS.
          FTP_VERIFY_CERTIFICATE: true
        run: uv run python/ftp_upload.py
