name: Update HC Stats

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hcstats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip sync --system pyproject.toml

      - name: Fetch stats
        env:
          HC_REPORT_TOKEN: ${{ secrets.HC_REPORT_TOKEN }}
          HC_REPORT_TEAM_ID: ${{ secrets.HC_REPORT_TEAM_ID }}
          HC_REPORT_SEASON_ID: ${{ secrets.HC_REPORT_SEASON_ID }}
          HC_REPORT_PHASE_ID: ${{ secrets.HC_REPORT_PHASE_ID }}
        run: python python/fetch_hcstats.py

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hcstats.json
          git commit -m "Update hcstats.json"
          git push
