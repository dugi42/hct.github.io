name: Update HC Stats

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hcstats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # uv reads 'requires-python' and dependencies from pyproject.toml
        run: uv sync

      - name: Fetch stats
        env:
          HC_REPORT_TOKEN: ${{ secrets.HC_REPORT_TOKEN }}
          HC_REPORT_TEAM_ID: ${{ secrets.HC_REPORT_TEAM_ID }}
          HC_REPORT_SEASON_ID: ${{ secrets.HC_REPORT_SEASON_ID }}
          HC_REPORT_PHASE_ID: ${{ secrets.HC_REPORT_PHASE_ID }}
        # 'uv run' ensures the script uses the environment we just synced
        run: uv run python/fetch_hcstats.py

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hcstats.json
          git commit -m "Update hcstats.json"
          git push