name: Live Ticker HC Stats

on:
  #schedule:
    #- cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1 # Faster checkout as we only need the latest state

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Fetch stats
        env:
          HC_REPORT_API_URL: ${{ secrets.HC_REPORT_API_URL }}
          HC_REPORT_TOKEN: ${{ secrets.HC_REPORT_TOKEN }}
        run: uv run python/fetch_hcstats.py --config python/config_season.json

      - name: Commit and Push (If changed)
        id: commit
        run: |
          if git diff --quiet public/hcstats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to hcstats.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/hcstats.json
            git commit -m "Update hcstats.json"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: update-stats
    if: needs.update-stats.outputs.changed == 'true'
    # Reuse the TLS mirror instead of a plaintext lftp upload: the hash-diff
    # mirror uploads only the changed file anyway, respects the ftp-publish
    # concurrency group (one FTP session at a time), and keeps credentials
    # off the wire.
    uses: ./.github/workflows/ftp-upload.yml
    secrets: inherit
